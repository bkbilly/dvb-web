name: Build Windows Executable

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows amd64 EXE & BDA Runner
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build BDA Runner Helper
        shell: cmd
        run: |
          mkdir dist
          cl.exe /O2 /EHsc /Fe:dist\bda-runner.exe cmd\bda-runner\main.cpp ole32.lib oleaut32.lib strmiids.lib uuid.lib

      - name: Build Windows Standalone Executable
        shell: cmd
        run: |
          go build -ldflags="-H=windowsgui -s -w" -o dist\dvb-web.exe .\cmd\server

      - name: Create Quickstart Guide
        shell: pwsh
        run: |
          @"
          ==================================================
                      DVB-Web for Windows
          ==================================================

          HOW TO RUN:
          1. Double-click `dvb-web.exe`.
          2. The TV broadcast icon will appear in your Windows taskbar / system tray (bottom-right near the clock).
          3. Click the icon (or right-click -> "Open Web UI") to open DVB-Web in your browser (http://localhost:8080).
          4. To close DVB-Web, right-click the taskbar icon and select "Exit".

          TUNER SUPPORT:
          - USB / PCIe BDA tuners (e.g. Crypto ReDi PC 50 A, Realtek, Hauppauge, TBS) are automatically detected!
          - The included `bda-runner.exe` manages BDA hardware tuning and transport stream capture.

          REQUIREMENTS:
          - FFmpeg: Place `ffmpeg.exe` in the same directory or install FFmpeg to your system PATH for video transcoding.

          CLI FLAGS (Optional):
          - `dvb-web.exe --port=8080` (custom port)
          - `dvb-web.exe --no-tray` (run in headless mode)
          - `dvb-web.exe --open` (automatically open browser on startup)
          "@ | Out-File -FilePath dist\QUICKSTART-WINDOWS.txt -Encoding utf8

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath dvb-web-windows-amd64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvb-web-windows-amd64
          path: dvb-web-windows-amd64.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dvb-web-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
